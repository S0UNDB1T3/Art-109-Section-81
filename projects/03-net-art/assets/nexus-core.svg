<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Nexus core interface</title>
  <desc id="desc">Abstract neon rings, arrows, tracks, and pixel grids on a black background.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <pattern id="pixels" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="9" height="9" fill="#060607"/>
      <rect x="12" y="12" width="9" height="9" fill="#060607"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="#060607"/>
  <rect width="1200" height="900" fill="url(#grid)"/>

  <g transform="translate(638 430)">
    <circle r="288" fill="none" stroke="#1b1c1f" stroke-width="86" stroke-dasharray="1220 590" transform="rotate(-38)"/>
    <circle r="202" fill="none" stroke="#a978ff" stroke-width="54" stroke-dasharray="470 800" transform="rotate(25)"/>
    <circle r="130" fill="#d8ff00" filter="url(#glow)" opacity=".98"/>
    <circle r="54" fill="url(#pixels)"/>
    <circle r="18" fill="#ff005c"/>
  </g>

  <path d="M0 615L310 386 530 592 312 798 0 798Z" fill="#a978ff"/>
  <path d="M0 650L264 455 469 614 288 754 0 754Z" fill="#f5f5f0"/>
  <path d="M0 705L258 512 423 640 271 758 0 758Z" fill="#ff005c"/>

  <g fill="#060607">
    <path d="M38 673H184L211 699H65Z"/>
    <path d="M76 718H222L249 744H103Z"/>
    <path d="M109 628H255L282 654H136Z"/>
  </g>

  <g fill="#d8ff00">
    <path d="M778 382h82l36 31-36 31h-82l36-31z"/>
    <path d="M875 382h82l36 31-36 31h-82l36-31z"/>
    <path d="M972 382h82l36 31-36 31h-82l36-31z"/>
  </g>

  <g transform="translate(83 88) rotate(42)">
    <rect width="520" height="72" rx="36" fill="#ff005c"/>
    <g fill="#f5f5f0" transform="translate(60 18)">
      <path d="M0 0h30l24 18-24 18H0l24-18z"/>
      <path d="M68 0h30l24 18-24 18H68l24-18z"/>
      <path d="M136 0h30l24 18-24 18h-30l24-18z"/>
      <path d="M204 0h30l24 18-24 18h-30l24-18z"/>
      <path d="M272 0h30l24 18-24 18h-30l24-18z"/>
    </g>
  </g>

  <g transform="translate(863 692) rotate(-22)">
    <rect width="278" height="82" rx="41" fill="#d8ff00"/>
    <text x="34" y="52" fill="#060607" font-family="monospace" font-size="26" font-weight="bold">FRAME / 0126</text>
  </g>

  <g fill="#ff005c">
    <rect x="1012" y="104" width="20" height="20"/>
    <rect x="1040" y="104" width="20" height="20"/>
    <rect x="1068" y="104" width="20" height="20"/>
    <rect x="1026" y="132" width="20" height="20"/>
    <rect x="1054" y="132" width="20" height="20"/>
    <rect x="1082" y="132" width="20" height="20"/>
  </g>

  <g fill="#56e8ff">
    <rect x="100" y="807" width="130" height="5"/>
    <rect x="250" y="807" width="74" height="5"/>
    <rect x="344" y="807" width="182" height="5"/>
  </g>

  <text x="63" y="70" fill="#a9aba7" font-family="monospace" font-size="18" letter-spacing="6">N26 / NEW WORLD NEXUS / CORE 01</text>
  <text x="879" y="838" fill="#a9aba7" font-family="monospace" font-size="16" letter-spacing="4">OBSERVER PRESENT</text>
